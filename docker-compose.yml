services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bioloop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bioloop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bioloop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bioloop_pg:
