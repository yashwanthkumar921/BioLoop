# ===================================================================
# BioLoop Platform - Application Properties
# ===================================================================

spring.application.name=bioloop-api

# Server Port
server.port=8080

# ===================================================================
# PostgreSQL Database Connection
# ===================================================================
spring.datasource.url=${BIOLOOP_DB_URL:jdbc:postgresql://localhost:5433/demodb}
spring.datasource.username=${BIOLOOP_DB_USER:postgres}
spring.datasource.password=${BIOLOOP_DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Multipart File Upload (Proofs, Inspection Photos)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# ===================================================================
# BioLoop Business & Security Settings
# ===================================================================
bioloop.jwt.secret=${BIOLOOP_JWT_SECRET:bioloop-super-secure-jwt-signing-secret-key-minimum-32-bytes!}
bioloop.jwt.expiration-ms=86400000
bioloop.seed=${BIOLOOP_SEED:true}
bioloop.upload-dir=${BIOLOOP_UPLOAD_DIR:uploads}
bioloop.cors-origins=${BIOLOOP_CORS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging
logging.level.com.bioloop=INFO
logging.level.org.springframework.security=WARN
