spring:
  application:
    name: bioloop-api
  datasource:
    url: ${BIOLOOP_DB_URL:jdbc:postgresql://localhost:5433/demodb}
    username: ${BIOLOOP_DB_USER:postgres}
    password: ${BIOLOOP_DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

server:
  port: 8080

bioloop:
  jwt:
    secret: ${BIOLOOP_JWT_SECRET:bioloop-super-secure-jwt-signing-secret-key-minimum-32-bytes!}
    expiration-ms: 86400000
  seed: ${BIOLOOP_SEED:true}
  upload-dir: ${BIOLOOP_UPLOAD_DIR:uploads}
  cors-origins: ${BIOLOOP_CORS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

logging:
  level:
    com.bioloop: INFO
